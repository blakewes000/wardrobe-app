<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page settings -->
  <meta charset="UTF-8">
  <!-- Makes the page fit phone screens properly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wardrobe</title>
  <!-- Load the styles (colors, sizes, layout) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar with the app name -->
  <header class="top-bar">
    <h1>Wardrobe</h1>
  </header>

  <!-- Main area: this is where each screen's content will go later -->
  <main class="content">
    <p class="placeholder">Your wardrobe is empty for now.</p>
  </main>

  <!-- Bottom menu with three buttons (they don't do anything yet) -->
  <nav class="bottom-nav">
    <button class="nav-button active">Wardrobe</button>
    <button class="nav-button">Outfit</button>
    <button class="nav-button">Saved</button>
  </nav>

  <!-- Load the JavaScript (the app's "brain") last, after the page is built -->
  <script src="app.js"></script>
</body>
</html>
