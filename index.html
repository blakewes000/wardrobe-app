<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic page settings -->
  <meta charset="UTF-8">
  <!-- Makes the page fit phone screens properly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wardrobe</title>
  <!-- Retro computer font from Google Fonts (falls back to Consolas if offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <!-- Load the styles (colors, sizes, layout) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar with the app name and a live item count -->
  <header class="top-bar">
    <h1>Wardrobe_Sys</h1>
    <span class="status" id="item-count">ITEMS: 0</span>
  </header>

  <!-- Main area -->
  <main class="content">

    <!-- Button that opens the Add-item form -->
    <button class="btn btn-wide" id="open-form-button">+ Add item</button>

    <!-- Add-item form. "hidden" means it starts closed. -->
    <form class="panel" id="add-form" hidden>
      <h2 class="panel-title" id="form-title">// New item</h2>

      <!-- Photo: a preview box plus buttons to choose or remove a photo -->
      <div class="form-row">
        <span class="label-text">Photo</span>
        <div class="photo-picker">
          <div class="photo-box" id="photo-preview">NO IMG</div>
          <div class="photo-buttons">
            <!-- Tapping this label opens the hidden file chooser below.
                 On phones it offers the camera or your photo library. -->
            <label class="btn btn-small" for="item-photo">Choose photo</label>
            <input id="item-photo" type="file" accept="image/*" hidden>
            <button type="button" class="btn btn-danger" id="remove-photo-button" hidden>Remove photo</button>
          </div>
        </div>
      </div>

      <div class="form-row">
        <label for="item-name">Name</label>
        <input id="item-name" type="text" placeholder="e.g. Black hoodie" required maxlength="60">
      </div>

      <!-- Category and warmth sit side by side -->
      <div class="form-split">
        <div class="form-row">
          <label for="item-category">Category</label>
          <select id="item-category">
            <option value="top">Top</option>
            <option value="bottom">Bottom</option>
            <option value="shoes">Shoes</option>
            <option value="outerwear">Outerwear</option>
            <option value="accessory">Accessory</option>
          </select>
        </div>
        <div class="form-row">
          <label for="item-warmth">Warmth</label>
          <select id="item-warmth">
            <option value="light">Light</option>
            <option value="medium">Medium</option>
            <option value="warm">Warm</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <label for="item-color">Color</label>
        <input id="item-color" type="text" placeholder="e.g. black" maxlength="30">
      </div>

      <div class="form-row">
        <label for="item-tags">Style tags (separate with commas)</label>
        <input id="item-tags" type="text" placeholder="e.g. streetwear, casual" maxlength="120">
      </div>

      <div class="form-buttons">
        <button type="submit" class="btn btn-good">Save</button>
        <button type="button" class="btn" id="cancel-button">Cancel</button>
      </div>
    </form>

    <!-- Message shown when there are no clothes yet -->
    <p class="placeholder" id="empty-message">&gt; Wardrobe empty. Add your first item.</p>

    <!-- The list of clothes. app.js fills this in. -->
    <ul class="item-list" id="item-list"></ul>
  </main>

  <!-- Bottom menu with three buttons (Outfit and Saved don't work yet) -->
  <nav class="bottom-nav">
    <button class="nav-button active">Wardrobe</button>
    <button class="nav-button">Outfit</button>
    <button class="nav-button">Saved</button>
  </nav>

  <!-- Load the JavaScript (the app's "brain") last, after the page is built -->
  <script src="app.js"></script>
</body>
</html>
